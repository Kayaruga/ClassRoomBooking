<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>เข้าสู่ระบบ | Classroom Booking</title>
  <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/login-style.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body><main><div class="main-wrapper"><section class="login-form"><div class="Claasroom_Booking"><div class="icon"><i class="fa-solid fa-book"></i></div><div class="Claasroom_Booking-info"><span>Classroom Booking</span><p>ระบบจองห้องเรียน</p></div></div><div class="login-info"><h1>เข้าสู่ระบบ</h1><p>เข้าสู่ระบบเพื่อค้นหาและจองห้องเรียน</p></div><form class="form-detail" id="loginForm"><label for="username">ชื่อผู้ใช้</label><input type="text" id="username" autocomplete="username" required placeholder="กรอกชื่อผู้ใช้"><label for="password">รหัสผ่าน</label><div class="password-field"><input type="password" id="password" autocomplete="current-password" required placeholder="กรอกรหัสผ่าน"><button type="button" class="toggle-password" aria-label="แสดงรหัสผ่าน"><i class="fa-solid fa-eye"></i><span>แสดง</span></button></div><p class="auth-message" id="authMessage" role="status"></p><button type="submit" class="login">เข้าสู่ระบบ</button><p class="auth-switch">ยังไม่มีบัญชี? <a href="register.html">สมัครใช้งาน</a></p></form></section><section class="imges-show"></section></div></main><script src="js/login.js?v=3"></script></body>
</html>

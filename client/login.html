<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
  <main>
    <div class="main-wrapper">
      <section class="login-form">
        <div class="Claasroom_Booking">
          <div class="icon">
            <i class="fa fa-book"></i>
          </div>
          <div class="Claasroom_Booking-info">
            <span>Claasroom Booking</span>
            <p>ระบบจองห้องเรียน</p>
          </div>
        </div>
        <div class="login-info">
          <h1>เข้าสู่ระบบ</h1>
          <p>กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
        </div>
        <form class="form-detail">
          <label for="name">ชื่อผู้ใช้</label><br>
          <input type="text" required id="name" placeholder="กรอกชื่อผู้ใช้"><br>
          <label for="password">รหัสผ่าน</label><br>
          <div class="password-field">
            <input required type="password" name="password" id="password" placeholder="กรอกรหัสผ่าน">
            <button type="button" id="togglePassword" aria-label="แสดงรหัสผ่าน">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="more-detail">
            <label for="remember"><input type="checkbox" id="remember">จดจำฉันไว้</label>
            <a href="#">ลืมรหัสผ่าน?</a>
          </div>
          <button type="submit" class="login">เข้าสู่ระบบ</button>
        </form>
      </section>
      <section class="imges-show"></section>
    </div>
  </main>
</body>

</html>

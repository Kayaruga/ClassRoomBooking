<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashborad.css"><link rel="stylesheet" href="css/admin.css?v=4"><link rel="stylesheet" href="css/manage.css?v=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><title>จัดการระบบ | Classroom Booking</title></head>
<body><div class="dashboard"><aside class="sidebar"><div class="logo"><i class="fa-solid fa-book"></i><h1>Classroom Booking</h1></div><nav class="sidebar-nav"><ul><li><a href="dashboard.html"><i class="fa-solid fa-house"></i>แดชบอร์ด</a></li><li><a href="rooms.html"><i class="fa-solid fa-calendar-plus"></i>จองห้อง</a></li><li><a href="my-bookings.html"><i class="fa-solid fa-clipboard-list"></i>การจองของฉัน</a></li><li><a href="admin.html" data-admin-link><i class="fa-solid fa-user-shield"></i>อนุมัติการจอง</a></li><li class="active"><a href="manage.html" data-admin-manage><i class="fa-solid fa-gears"></i>จัดการระบบ</a></li><li><a href="login.html" data-logout><i class="fa-solid fa-right-from-bracket"></i>ออกจากระบบ</a></li></ul></nav></aside><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="page"><header class="page-header"><button type="button" class="barsmenu" id="menuToggle" aria-label="เปิดเมนู"><i class="fa-solid fa-bars"></i></button><div class="page-header-profile"><span>สวัสดี <b data-user-name>...</b></span><img src="imges/profile.png" alt="รูปโปรไฟล์ผู้ใช้"><button type="button" class="header-logout" data-logout>ออกจากระบบ</button></div></header><main class="manage-content"><section class="manage-hero"><div><p class="eyebrow">SYSTEM MANAGEMENT</p><h2>จัดการข้อมูลระบบ</h2><p>เพิ่ม แก้ไข หรือลบข้อมูลห้อง และกำหนดสิทธิ์ผู้ใช้งาน</p></div><i class="fa-solid fa-gears"></i></section><section class="manage-grid"><article class="manage-panel"><div class="manage-heading"><h3>จัดการห้องเรียน</h3><button id="newRoom" type="button"><i class="fa-solid fa-plus"></i> เพิ่มห้อง</button></div><form id="roomForm" class="room-editor" hidden><input id="roomId" type="hidden"><label>รหัสห้อง<input id="roomCode" placeholder="เช่น IT-407" required></label><label>อาคาร<input id="roomBuilding" value="อาคาร IT" required></label><label>ชั้น<input id="roomFloor" type="number" min="1" required></label><label>ความจุ<input id="roomCapacity" type="number" min="1" required></label><label class="full">อุปกรณ์<input id="roomEquipment" placeholder="เช่น โปรเจกเตอร์,Wi-Fi,กระดาน" required></label><div class="editor-actions full"><button type="button" id="cancelRoom">ยกเลิก</button><button type="submit">บันทึกห้อง</button></div><p id="roomMessage" class="manage-message"></p></form><div id="roomsAdminList" class="manage-list"></div></article><article class="manage-panel"><div class="manage-heading"><h3>จัดการบัญชีผู้ใช้</h3><span>กำหนดบทบาทได้</span></div><div id="usersAdminList" class="manage-list"></div></article></section></main></div></div><script src="js/dsshborad.js?v=2"></script><script src="js/auth-guard.js?v=4"></script><script src="js/manage.js?v=1"></script></body></html>

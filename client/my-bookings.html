<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashborad.css">
  <link rel="stylesheet" href="css/my-bookings.css">
  <link rel="stylesheet" href="css/booking-status.css?v=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <title>การจองของฉัน | Classroom Booking</title>
</head>

<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo"><i class="fa-solid fa-book"></i>
        <h1>Classroom Booking</h1>
      </div>
      <nav class="sidebar-nav" aria-label="เมนูหลัก">
        <ul>
          <li><a href="dashboard.html"><i class="fa-solid fa-house"></i>แดชบอร์ด</a></li>
          <li><a href="rooms.html"><i class="fa-solid fa-calendar-plus"></i>จองห้อง</a></li>
          <li class="active"><a href="my-bookings.html"><i class="fa-solid fa-clipboard-list"></i>การจองของฉัน</a></li>
          <li><a href="login.html" data-logout><i class="fa-solid fa-right-from-bracket"></i>ออกจากระบบ</a></li>
        </ul>
      </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="page">
      <header class="page-header"><button type="button" class="barsmenu" id="menuToggle" aria-label="เปิดเมนู"
          aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
        <div class="page-header-profile"><span>สวัสดี <b data-user-name>...</b></span><img src="imges/profile.png"
            alt="รูปโปรไฟล์ผู้ใช้"><button type="button" class="header-logout" data-logout><i
              class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button></div>
      </header>
      <main class="bookings-content">
        <section class="bookings-hero">
          <div>
            <p class="eyebrow">MY BOOKINGS</p>
            <h2>การจองของฉัน</h2>
            <p>ตรวจสอบรายการจอง และยกเลิกได้ก่อนถึงเวลาที่ใช้งาน</p>
          </div><i class="fa-solid fa-clipboard-list"></i>
        </section>
        <section class="bookings-panel">
          <div class="bookings-heading">
            <div>
              <h3>รายการจองทั้งหมด</h3>
              <p id="bookingsCount">กำลังโหลดข้อมูล...</p>
            </div><a href="rooms.html"><i class="fa-solid fa-plus"></i> จองห้องเพิ่ม</a>
          </div>
          <div id="bookingsList" class="bookings-list"></div>
          <div id="bookingsEmpty" class="bookings-empty" hidden><i class="fa-regular fa-calendar-xmark"></i>
            <h3>ยังไม่มีรายการจอง</h3>
            <p>เริ่มค้นหาห้องที่ว่างและจองได้เลย</p><a href="rooms.html">ไปหน้าจองห้อง</a>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="js/dsshborad.js?v=2"></script>
  <script src="js/auth-guard.js?v=3"></script>
  <script src="js/my-bookings.js?v=3"></script>
</body>

</html>
